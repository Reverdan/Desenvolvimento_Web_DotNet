<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login com Validação</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #eef5ff, #dfeeff);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .login-box {
      width: 360px;
      background-color: #ffffff;
      padding: 30px 25px;
      border-radius: 12px;
      box-shadow: 0 14px 28px rgba(0, 0, 0, 0.12);
    }

    h1 {
      margin-top: 0;
      margin-bottom: 22px;
      text-align: center;
      color: #1e2d3d;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
      color: #334155;
    }

    input {
      width: 100%;
      padding: 12px 10px;
      margin-bottom: 18px;
      border: 1px solid #c7d2e0;
      border-radius: 8px;
      outline: none;
    }

    input:focus {
      border-color: #4a90e2;
      box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.15);
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background-color: #4a90e2;
      color: #ffffff;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    button:hover {
      background-color: #3f81d4;
    }
  </style>
</head>
<body>
  <div class="login-box">
    <h1>Login</h1>

    <form id="formLogin">
      <label for="usuario">Nome de usuário</label>
      <input type="text" id="usuario" name="usuario" placeholder="Digite seu nome">

      <label for="senha">Senha</label>
      <input type="password" id="senha" name="senha" placeholder="Digite sua senha">

      <button type="submit" id="entrar">Entrar</button>
    </form>
  </div>

  <script>
    const formLogin = document.getElementById('formLogin');
    const usuario = document.getElementById('usuario');
    const senha = document.getElementById('senha');

    formLogin.addEventListener('submit', function (event) {
      event.preventDefault();

      const nome = usuario.value.trim();
      const senhaDigitada = senha.value.trim();

      if (nome === '' || senhaDigitada === '') {
        alert('Preencha todos os campos antes de entrar.');
        return;
      }

      if (nome === 'admin' && senhaDigitada === '1234') {
        alert('Login realizado com sucesso!');
      } else {
        alert('Nome de usuário ou senha inválidos.');
      }
    });
  </script>
</body>
</html>
