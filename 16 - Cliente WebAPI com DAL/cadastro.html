<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de pessoa</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page-shell">
    <nav class="topbar" aria-label="Navegação principal">
      <a class="brand" href="cadastro.html">Pessoas API</a>
      <div class="nav-links">
        <a class="active" href="cadastro.html">Cadastro</a>
        <a href="operacoes.html">Consultas e operações</a>
      </div>
    </nav>

    <section class="page-heading">
      <p class="eyebrow">POST /api/pessoas</p>
      <h1>Cadastre uma pessoa</h1>
      <p>Envie os dados para a Web API e acompanhe a resposta da operação.</p>
    </section>

    <section class="form-panel" aria-labelledby="titulo-formulario">
      <h2 id="titulo-formulario">Dados da pessoa</h2>
      <form id="formCadastro">
        <label for="nome">Nome</label>
        <input id="nome" name="nome" type="text" maxlength="50" required autocomplete="name">

        <div class="field-grid">
          <div>
            <label for="rg">RG</label>
            <input id="rg" name="rg" type="text" maxlength="11">
          </div>
          <div>
            <label for="cpf">CPF</label>
            <input id="cpf" name="cpf" type="text" maxlength="13">
          </div>
        </div>

        <button type="submit" id="botaoCadastrar">Cadastrar pessoa</button>
      </form>
      <p id="mensagem" class="message" role="status"></p>
    </section>
  </main>
  <script src="cadastro.js"></script>
</body>
</html>
